name: Aktualizovat pracovní nabídky

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vyhledat a ověřit nabídky
        run: python scripts/update_jobs.py
      - name: Uložit změny
        run: |
          if git diff --quiet -- dist/data/jobs.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/jobs.json
          git commit -m "Aktualizace pracovních nabídek"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publikovat aktuální web
        id: deployment
        uses: actions/deploy-pages@v4
